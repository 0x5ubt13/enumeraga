[pytest]
minversion = 6.0
# `live` is excluded by default because it spawns a server subprocess and binds a port.
# Run it explicitly with `pytest -m live` (a command-line -m overrides the one below).
addopts = -ra -q -m "not live"
testpaths = tests
pythonpath = .
markers =
    live: boots the server and drives it as a real MCP client over HTTP
